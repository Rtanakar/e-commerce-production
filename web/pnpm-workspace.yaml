# zod dedupe — ek hi version (4.4.3) taaki @hookform/resolvers/zod ke types
# zod v4 schema ke saath clean align ho (warna zodResolver pe cast lagana padta
# kyunki MCP SDK zod@3 pull karta hai). skipLibCheck:true → SDK ke internal
# zod-3 types humein affect nahi karte.
overrides:
  zod: 4.4.3

allowBuilds:
  msw: set this to true or false
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
